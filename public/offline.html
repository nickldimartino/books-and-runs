<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Books &amp; Runs — offline</title>
    <!--
      Precached at service-worker install time (see public/sw.js) and shown
      only when a page that was never visited (so has nothing of its own in
      the cache) is requested with no connection — a returning visit to an
      already-cached page never reaches this. Plain, theme-agnostic Midnight
      styling: this loads with no app JS available, so it can't read the
      player's saved theme the way global-error.tsx does.
    -->
    <style>
      html, body {
        margin: 0;
        min-height: 100vh;
        background: #0a2b20;
        color: #f5f0e6;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 0 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #fef3c7;
        margin: 0;
      }
      p {
        font-size: 0.875rem;
        color: rgba(209, 250, 229, 0.78);
        max-width: 22rem;
        margin: 0;
      }
      button {
        border: none;
        cursor: pointer;
        border-radius: 0.5rem;
        background: #fbbf24;
        color: #022c22;
        padding: 0.75rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <span style="font-size: 2rem" aria-hidden="true">🃏</span>
    <h1>You&rsquo;re offline</h1>
    <p>This page hasn&rsquo;t been loaded before, so there&rsquo;s nothing saved to show without a
      connection. A page you&rsquo;ve already visited will still work offline.</p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
