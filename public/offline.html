<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Books &amp; Runs — offline</title>
    <!--
      Precached at service-worker install time (see public/sw.js) and shown
      only when a page that was never visited (so has nothing of its own in
      the cache) is requested with no connection — a returning visit to an
      already-cached page never reaches this. Plain, theme-agnostic Midnight
      styling: this loads with no app JS available, so it can't read the
      player's saved theme the way global-error.tsx does.
    -->
    <style>
      html, body {
        margin: 0;
        min-height: 100vh;
        background: #0a2b20;
        color: #f5f0e6;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 0 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #fef3c7;
        margin: 0;
      }
      p {
        font-size: 0.875rem;
        color: rgba(209, 250, 229, 0.78);
        max-width: 22rem;
        margin: 0;
      }
      button {
        border: none;
        cursor: pointer;
        border-radius: 0.5rem;
        background: #fbbf24;
        color: #022c22;
        padding: 0.75rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <span style="font-size: 2rem" aria-hidden="true">🃏</span>
    <h1 id="t">You&rsquo;re offline</h1>
    <p id="b">This page hasn&rsquo;t been loaded before, so there&rsquo;s nothing saved to show without a
      connection. A page you&rsquo;ve already visited will still work offline.</p>
    <button id="r" onclick="location.reload()">Try again</button>
    <script>
      (function () {
        var D = {"zh": ["你已离线", "此页面之前没有加载过，因此没有联网时可显示的已保存内容。你访问过的页面在离线时仍可使用。", "重试"], "ja": ["オフラインです", "このページはまだ読み込まれたことがないため、接続なしで表示できる保存済みデータがありません。以前に開いたページはオフラインでも使えます。", "再試行"], "ko": ["오프라인이에요", "이 페이지는 아직 불러온 적이 없어서 연결 없이 보여줄 저장된 내용이 없어요. 이미 방문한 페이지는 오프라인에서도 작동해요.", "다시 시도"], "de": ["Du bist offline", "Diese Seite wurde noch nie geladen, daher gibt es ohne Verbindung nichts Gespeichertes zu zeigen. Bereits besuchte Seiten funktionieren weiterhin offline.", "Erneut versuchen"], "fr": ["Tu es hors ligne", "Cette page n'a jamais été chargée, donc rien n'est enregistré à afficher sans connexion. Une page déjà visitée fonctionnera toujours hors ligne.", "Réessayer"], "es": ["Estás sin conexión", "Esta página no se ha cargado antes, así que no hay nada guardado que mostrar sin conexión. Las páginas que ya visitaste seguirán funcionando sin conexión.", "Reintentar"], "pt-BR": ["Você está offline", "Esta página nunca foi carregada, então não há nada salvo para mostrar sem conexão. Páginas que você já visitou continuam funcionando offline.", "Tentar novamente"], "ru": ["Ты не в сети", "Эта страница раньше не загружалась, поэтому без подключения показывать нечего. Уже посещённые страницы продолжат работать офлайн.", "Повторить"], "it": ["Sei offline", "Questa pagina non è mai stata caricata, quindi senza connessione non c'è nulla di salvato da mostrare. Le pagine già visitate funzioneranno comunque offline.", "Riprova"]};
        var l; try { l = localStorage.getItem("booksAndRuns:locale"); } catch (e) {}
        var d = D[l]; if (!d) return;
        document.documentElement.lang = l;
        document.getElementById("t").textContent = d[0];
        document.getElementById("b").textContent = d[1];
        document.getElementById("r").textContent = d[2];
        document.title = "Books & Runs — " + d[0];
      })();
    </script>
  </body>
</html>
