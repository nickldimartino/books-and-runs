name: Update visual baselines

# Manual-only (workflow_dispatch) — regenerates the Linux screenshot
# baselines e2e/visual.spec.ts's CI run (the e2e-visual job in ci.yml)
# compares against, then opens a PR with the result rather than pushing
# straight to main: a changed baseline PNG is only reviewable by actually
# looking at it, and this workflow has no way to know whether a diff is the
# deliberate visual change that prompted the run or a real regression it
# just baked in as the new "correct" image. Run this after a deliberate
# visual change (new theme, layout change on one of the covered screens),
# then look at the PR's image diffs before merging — never trust it blind.
#
# Runs inside the exact same pinned Playwright Docker image the e2e-visual
# CI job compares against (see that job's own doc in ci.yml for why the
# image, not just "some Linux box", is what makes this reproducible).
# Bump the image tag in both places together if @playwright/test's version
# changes.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      # See the e2e-visual job in ci.yml for why this is needed — same
      # image, same root-vs-$HOME-ownership issue for Firefox.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      # Running as root in the container, over a checkout owned by whatever
      # UID actions/checkout used — git's own ownership guard (CVE-2022-24765)
      # refuses to touch a repo it doesn't recognize as "mine" without this,
      # failing every git command below with "detected dubious ownership".
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run test:e2e:visual -- --update-snapshots
      # Regenerating can touch macOS-named files too if a developer's local
      # run ever drifted them from what CI expects — but this workflow only
      # ever runs on Linux, so it can only actually produce *-linux.png
      # changes. Scoping `git add` to the snapshots directory regardless,
      # so nothing else this job's own run touched (playwright-report/,
      # node_modules/, …) can end up in the PR by accident.
      - id: diff
        run: |
          git add e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="update-visual-baselines-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$branch"
          git commit -m "Update Linux visual regression baselines"
          git push origin "$branch"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
      # Deliberately not the `gh` CLI — the Playwright image doesn't have it
      # installed, and installing it (its own apt repo + keyring) just for
      # one API call is more moving parts than this needs. Node ships in
      # this image for Playwright itself, so a plain fetch is the smallest
      # dependency-free way to open the PR.
      - if: steps.diff.outputs.changed == 'true'
        run: |
          # Single quotes below are deliberate: this is a Node script, not
          # shell, and its own ${} interpolation (process.env) must NOT be
          # expanded by the shell before node ever sees it.
          # shellcheck disable=SC2016
          node -e '
            const body = {
              title: "Update Linux visual regression baselines",
              head: process.env.BRANCH,
              base: "main",
              body: "Regenerated by the `Update visual baselines` workflow (`mcr.microsoft.com/playwright:v1.63.0-noble`). Review the image diffs below before merging — a changed baseline is only correct if the new render is what the covered screen (Home, New Game, How to Play, Settings) is actually supposed to look like now.",
            };
            fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: "application/vnd.github+json",
                "Content-Type": "application/json",
              },
              body: JSON.stringify(body),
            })
              .then(async (r) => {
                const json = await r.json();
                if (!r.ok) throw new Error(`${r.status} ${JSON.stringify(json)}`);
                console.log("Opened", json.html_url);
              })
              .catch((err) => {
                console.error(err);
                process.exit(1);
              });
          '
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.diff.outputs.changed == 'false'
        run: echo "No baseline changes — nothing to open a PR for."
