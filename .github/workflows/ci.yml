name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Node 22's bundled npm doesn't match the npm version package-lock.json
      # was generated with, and `npm ci` validates the lockfile strictly
      # enough that the mismatch fails it outright ("Missing: typescript@…
      # from lock file") even though the lockfile and package.json really
      # are in sync. Pinning here to the same npm version used locally is
      # more reliable than chasing whatever setup-node's default drifts to.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Translation guards (also part of `npm test`; listed separately so a failure is labeled).
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build
      - run: node scripts/check-bundle.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Node 22's bundled npm doesn't match the npm version package-lock.json
      # was generated with, and `npm ci` validates the lockfile strictly
      # enough that the mismatch fails it outright ("Missing: typescript@…
      # from lock file") even though the lockfile and package.json really
      # are in sync. Pinning here to the same npm version used locally is
      # more reliable than chasing whatever setup-node's default drifts to.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      # Excludes e2e/visual.spec.ts — its baselines were made on macOS, and
      # Playwright's screenshot comparison is platform-sensitive (font
      # rasterization differs enough between macOS and this runner's Linux
      # to fail on rendering noise, not a real regression). Run those
      # locally with `npm run test:e2e:visual` instead; see the spec file's
      # own doc for what it'd take to run them here too.
      # Includes e2e/pseudo-locale.spec.ts (no secrets needed): every guest route in the
      # dev-only pseudo-locale must show no plain-English runs.
      - run: npm run test:e2e:ci
        env:
          # The dev server reads these; absent, "With friends" shows the
          # signed-out prompt, which the specs still handle.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Opt-in: every spec built on e2e/helpers/testAccounts.ts — MP
          # (multiplayer.spec.ts), friends.spec.ts, clubs.spec.ts, and
          # tournaments.spec.ts, all driving two real accounts against the
          # live `mp` function/RLS/RPCs — self-skips unless this is also
          # set. Add a SUPABASE_SERVICE_ROLE_KEY repo secret (Supabase
          # dashboard → Project Settings → API → "service_role") to
          # actually run them here — an unset secret resolves to an empty
          # string, which they all treat the same as "not configured".
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
