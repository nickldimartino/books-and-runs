name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone — scripts/check-
          # release-notes.mjs below needs to `git diff` against a commit
          # that's often well outside a depth-1 checkout.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Node 22's bundled npm doesn't match the npm version package-lock.json
      # was generated with, and `npm ci` validates the lockfile strictly
      # enough that the mismatch fails it outright ("Missing: typescript@…
      # from lock file") even though the lockfile and package.json really
      # are in sync. Pinning here to the same npm version used locally is
      # more reliable than chasing whatever setup-node's default drifts to.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Translation guards (also part of `npm test`; listed separately so a failure is labeled).
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build
      - run: node scripts/check-bundle.mjs
      # See the script's own doc — fails loudly if this push/PR touches
      # player-facing code without also touching app/lib/releases.ts,
      # instead of relying on a human (or an AI assistant) to remember
      # every single time, which had already failed once by the time this
      # was added.
      - run: node scripts/check-release-notes.mjs "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Node 22's bundled npm doesn't match the npm version package-lock.json
      # was generated with, and `npm ci` validates the lockfile strictly
      # enough that the mismatch fails it outright ("Missing: typescript@…
      # from lock file") even though the lockfile and package.json really
      # are in sync. Pinning here to the same npm version used locally is
      # more reliable than chasing whatever setup-node's default drifts to.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      # Excludes e2e/visual.spec.ts — see the e2e-visual job below, which
      # runs those against Linux baselines in a pinned Docker image instead
      # of plain ubuntu-latest (this job's bare Linux font rendering still
      # wouldn't byte-match either the macOS baselines or a Docker-pinned
      # Linux baseline reliably).
      # Includes e2e/pseudo-locale.spec.ts (no secrets needed): every guest route in the
      # dev-only pseudo-locale must show no plain-English runs.
      - run: npm run test:e2e:ci
        env:
          # The dev server reads these; absent, "With friends" shows the
          # signed-out prompt, which the specs still handle.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Opt-in: every spec built on e2e/helpers/testAccounts.ts — MP
          # (multiplayer.spec.ts), friends.spec.ts, clubs.spec.ts, and
          # tournaments.spec.ts, all driving two real accounts against the
          # live `mp` function/RLS/RPCs — self-skips unless this is also
          # set. Add a SUPABASE_SERVICE_ROLE_KEY repo secret (Supabase
          # dashboard → Project Settings → API → "service_role") to
          # actually run them here — an unset secret resolves to an empty
          # string, which they all treat the same as "not configured".
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Visual regression (e2e/visual.spec.ts), split out from the `e2e` job
  # above because it needs Linux-rendered baselines, not the committed
  # macOS ones — see that spec file's own doc. Runs inside Playwright's own
  # Docker image rather than plain ubuntu-latest: that pins the exact
  # browser builds *and* font/freetype stack a baseline was made with, so a
  # diff here means a real pixel regression, not two Linux boxes
  # rasterizing fonts slightly differently. The image tag's version must
  # match package.json's @playwright/test version exactly (mismatched
  # Playwright-vs-browser versions fail fast with a clear error rather than
  # silently misbehaving) — bump both together.
  #
  # Baselines (e2e/visual.spec.ts-snapshots/*-linux.png) are generated and
  # committed by the separate update-visual-baselines.yml workflow
  # (workflow_dispatch) — this job only ever compares against them, never
  # writes them, so a stale baseline fails loudly here instead of silently
  # passing.
  e2e-visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      # The container runs as root, and Firefox refuses to start as root
      # unless $HOME is a directory root actually owns — GitHub Actions'
      # default container $HOME (/github/home) is owned by the image's
      # unprivileged `pwuser` instead, which fails with "Running Nightly as
      # root in a regular user's session is not supported." This is
      # Playwright's own documented workaround for exactly that image.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      # No actions/setup-node here — the Playwright image already bundles a
      # compatible Node, and its own npm matches what this image's browsers
      # were built against.
      - run: npm ci
      - run: npm run test:e2e:visual
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 7
