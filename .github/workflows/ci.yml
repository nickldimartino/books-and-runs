name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node scripts/check-bundle.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Excludes e2e/visual.spec.ts — its baselines were made on macOS, and
      # Playwright's screenshot comparison is platform-sensitive (font
      # rasterization differs enough between macOS and this runner's Linux
      # to fail on rendering noise, not a real regression). Run those
      # locally with `npm run test:e2e:visual` instead; see the spec file's
      # own doc for what it'd take to run them here too.
      - run: npm run test:e2e:ci
        env:
          # The dev server reads these; absent, "With friends" shows the
          # signed-out prompt, which the specs still handle.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Opt-in: e2e/multiplayer.spec.ts (two real accounts vs. the live
          # `mp` function) self-skips unless this is also set. Add a
          # SUPABASE_SERVICE_ROLE_KEY repo secret (Supabase dashboard →
          # Project Settings → API → "service_role") to actually run it
          # here — an unset secret resolves to an empty string, which the
          # spec treats the same as "not configured".
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
